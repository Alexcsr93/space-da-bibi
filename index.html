<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space da Bibi - Gestão & Convivência</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ec4899">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen pb-20 text-slate-800">

  <!-- Header -->
  <header class="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="rocket" class="w-6 h-6"></i>
        <h1 class="text-xl font-bold tracking-wide">Space da Bibi</h1>
      </div>
      <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-medium">v1.0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Navegação de Abas -->
    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200">
      <button id="tab-gastos-btn" onclick="switchTab('gastos')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all bg-pink-500 text-white shadow-sm">
        <i data-lucide="wallet" class="w-4 h-4"></i> Financeiro
      </button>
      <button id="tab-rotina-btn" onclick="switchTab('rotina')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900">
        <i data-lucide="calendar" class="w-4 h-4"></i> Rotina & Report
      </button>
    </div>

    <!-- SEÇÃO: GASTOS FINANCEIROS -->
    <section id="section-gastos" class="space-y-4">
      
      <!-- Resumo do Mês -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-2 gap-4">
        <div class="bg-pink-50 p-3 rounded-xl border border-pink-100">
          <p class="text-xs font-semibold text-pink-600 uppercase tracking-wider">Total Gasto</p>
          <p id="total-gasto" class="text-xl font-extrabold text-pink-900 mt-1">R$ 0,00</p>
        </div>
        <div class="bg-purple-50 p-3 rounded-xl border border-purple-100">
          <p class="text-xs font-semibold text-purple-600 uppercase tracking-wider">Lançamentos</p>
          <p id="total-registros" class="text-xl font-extrabold text-purple-900 mt-1">0</p>
        </div>
      </div>

      <!-- Formulário de Novo Gasto -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-pink-500"></i> Novo Lançamento
        </h2>
        
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Descrição</label>
          <input type="text" id="gasto-desc" placeholder="Ex: Farmácia, Roupas, Mensalidade" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-pink-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="gasto-valor" placeholder="0,00" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-pink-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Categoria</label>
            <select id="gasto-cat" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-pink-500 bg-white">
              <option value="Escola">Escola / Estudos</option>
              <option value="Saúde">Saúde / Farmácia</option>
              <option value="Vestuário">Vestuário / Calçados</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Lazer">Lazer / Passeios</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Divisão</label>
            <select id="gasto-divisao" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-pink-500 bg-white">
              <option value="50/50">Dividido 50/50</option>
              <option value="100% Pai">100% Pai</option>
              <option value="100% Mãe">100% Mãe</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Comprovante (Drive Link)</label>
            <input type="url" id="gasto-drive" placeholder="Cole o link do Google Drive" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-pink-500">
          </div>
        </div>

        <button onclick="adicionarGasto()" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-lg text-sm transition-all shadow-md flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-4 h-4"></i> Salvar Despesa
        </button>
      </div>

      <!-- Lista de Gastos -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-700">Histórico de Gastos</h3>
          <button onclick="exportarCSV()" class="text-xs text-pink-600 font-semibold flex items-center gap-1 hover:underline">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar CSV
          </button>
        </div>
        <div id="lista-gastos" class="space-y-2">
          <p class="text-xs text-center text-slate-400 py-4">Nenhum gasto registrado ainda.</p>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: ROTINA & REPORT DIÁRIO -->
    <section id="section-rotina" class="space-y-4 hidden">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="sun" class="w-5 h-5 text-amber-500"></i> Report Diário da Bibi
        </h2>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Data do Acompanhamento</label>
          <input type="date" id="rotina-data" class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-purple-500">
        </div>

        <!-- Checkbox Rápidos -->
        <div class="space-y-2 pt-2">
          <label class="text-xs font-semibold text-slate-600">Marcadores do Dia</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200 cursor-pointer">
              <input type="checkbox" id="check-refeicao" class="rounded text-purple-600"> Refeições OK
            </label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200 cursor-pointer">
              <input type="checkbox" id="check-remedio" class="rounded text-purple-600"> Medicamentos OK
            </label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200 cursor-pointer">
              <input type="checkbox" id="check-licao" class="rounded text-purple-600"> Lição / Deveres
            </label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200 cursor-pointer">
              <input type="checkbox" id="check-banho" class="rounded text-purple-600"> Banho / Higiene
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Observações / Destaques do Dia</label>
          <textarea id="rotina-obs" rows="3" placeholder="Ex: Hoje fomos ao parque, ela comeu super bem no almoço e dormiu às 21h." class="w-full text-sm p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-purple-500"></textarea>
        </div>

        <button onclick="gerarReportWhatsApp()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm transition-all shadow-md flex items-center justify-center gap-2">
          <i data-lucide="message-square" class="w-4 h-4"></i> Gerar Report para WhatsApp
        </button>
      </div>

      <!-- Preview do Report -->
      <div id="box-preview-report" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2 hidden">
        <h3 class="text-xs font-bold text-slate-500 uppercase">Texto Próximo para Copiar:</h3>
        <div id="texto-report" class="bg-slate-50 p-3 rounded-lg text-xs font-mono text-slate-700 whitespace-pre-wrap border border-slate-200"></div>
        <button onclick="copiarTextoReport()" class="w-full py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Texto
        </button>
      </div>
    </section>

  </main>

  <script>
    // Inicialização
    document.getElementById('rotina-data').valueAsDate = new Date();
    let gastos = JSON.parse(localStorage.getItem('space_bibi_gastos')) || [];
    renderizarGastos();

    // Ícones Lucide
    lucide.createIcons();

    function switchTab(tab) {
      const gSec = document.getElementById('section-gastos');
      const rSec = document.getElementById('section-rotina');
      const gBtn = document.getElementById('tab-gastos-btn');
      const rBtn = document.getElementById('tab-rotina-btn');

      if (tab === 'gastos') {
        gSec.classList.remove('hidden');
        rSec.classList.add('hidden');
        gBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all bg-pink-500 text-white shadow-sm";
        rBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900";
      } else {
        rSec.classList.remove('hidden');
        gSec.classList.add('hidden');
        rBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all bg-purple-600 text-white shadow-sm";
        gBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900";
      }
    }

    function adicionarGasto() {
      const desc = document.getElementById('gasto-desc').value.trim();
      const valor = parseFloat(document.getElementById('gasto-valor').value);
      const cat = document.getElementById('gasto-cat').value;
      const divisao = document.getElementById('gasto-divisao').value;
      const drive = document.getElementById('gasto-drive').value.trim();

      if (!desc || isNaN(valor) || valor <= 0) {
        alert('Por favor, preencha a descrição e um valor válido.');
        return;
      }

      const novoGasto = {
        id: Date.now(),
        data: new Date().toLocaleDateString('pt-BR'),
        desc,
        valor,
        cat,
        divisao,
        drive
      };

      gastos.unshift(novoGasto);
      localStorage.setItem('space_bibi_gastos', JSON.stringify(gastos));
      
      // Reset formulário
      document.getElementById('gasto-desc').value = '';
      document.getElementById('gasto-valor').value = '';
      document.getElementById('gasto-drive').value = '';

      renderizarGastos();
    }

    function removerGasto(id) {
      gastos = gastos.filter(g => g.id !== id);
      localStorage.setItem('space_bibi_gastos', JSON.stringify(gastos));
      renderizarGastos();
    }

    function renderizarGastos() {
      const container = document.getElementById('lista-gastos');
      const totalEl = document.getElementById('total-gasto');
      const regEl = document.getElementById('total-registros');

      container.innerHTML = '';
      let total = 0;

      if (gastos.length === 0) {
        container.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">Nenhum gasto registrado ainda.</p>';
        totalEl.innerText = 'R$ 0,00';
        regEl.innerText = '0';
        return;
      }

      gastos.forEach(g => {
        total += g.valor;
        const item = document.createElement('div');
        item.className = "flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100";
        item.innerHTML = `
          <div>
            <p class="text-xs font-bold text-slate-800">${g.desc}</p>
            <p class="text-[10px] text-slate-500">${g.data} • <span class="font-medium text-pink-600">${g.cat}</span> (${g.divisao})</p>
            ${g.drive ? `<a href="${g.drive}" target="_blank" class="inline-flex items-center gap-1 text-[10px] text-blue-600 hover:underline mt-1"><i data-lucide="external-link" class="w-3 h-3"></i> Comprovante (Drive)</a>` : ''}
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-extrabold text-slate-900">R$ ${g.valor.toFixed(2).replace('.', ',')}</span>
            <button onclick="removerGasto(${g.id})" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `;
        container.appendChild(item);
      });

      totalEl.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
      regEl.innerText = gastos.length;
      lucide.createIcons();
    }

    function exportarCSV() {
      if (gastos.length === 0) return alert('Sem gastos para exportar.');
      let csv = 'Data;Descrição;Categoria;Valor;Divisão;Link Drive\n';
      gastos.forEach(g => {
        csv += `${g.data};"${g.desc}";${g.cat};${g.valor.toFixed(2)};${g.divisao};${g.drive || ''}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', `gastos_space_da_bibi.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function gerarReportWhatsApp() {
      const dataStr = document.getElementById('rotina-data').value;
      const ref = document.getElementById('check-refeicao').checked ? '✅ OK' : '❌ Pendente';
      const rem = document.getElementById('check-remedio').checked ? '✅ OK' : '❌ Pendente';
      const lic = document.getElementById('check-licao').checked ? '✅ OK' : '❌ Pendente';
      const ban = document.getElementById('check-banho').checked ? '✅ OK' : '❌ Pendente';
      const obs = document.getElementById('rotina-obs').value.trim();

      const texto = `🌸 *REPORT DIÁRIO - SPACE DA BIBI* 🌸\n📅 Data: ${dataStr}\n\n*Resumo da Rotina:*\n• Refeições: ${ref}\n• Medicamentos: ${rem}\n• Tarefas/Estudos: ${lic}\n• Higiene/Banho: ${ban}\n\n*Observações:* ${obs || 'Tudo correu muito bem por aqui!'}`;

      document.getElementById('texto-report').innerText = texto;
      document.getElementById('box-preview-report').classList.remove('hidden');
    }

    function copiarTextoReport() {
      const texto = document.getElementById('texto-report').innerText;
      navigator.clipboard.writeText(texto);
      alert('Report copiado! É só colar no WhatsApp.');
    }

    // Registro do Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
