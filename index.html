<!-- Adicionar no Header do index.html -->
<header class="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 shadow-md sticky top-0 z-40">
  <div class="max-w-md mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold text-lg">🚀</div>
      <div>
        <h1 class="font-bold text-lg leading-tight">Space da Bibi</h1>
        <p class="text-xs text-pink-100">Gestão de Gastos e Rotina</p>
      </div>
    </div>
    
    <!-- Botão de Autenticação com o Google -->
    <div id="auth-container">
      <button id="btn-login-google" onclick="loginComGoogle()" class="text-xs bg-white text-pink-600 font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-pink-50 transition flex items-center gap-1.5">
        <i class="fab fa-google text-red-500"></i> Entrar
      </button>
      <div id="user-info" class="hidden flex items-center gap-2">
        <img id="user-photo" src="" class="w-7 h-7 rounded-full border border-white/40">
        <button onclick="logoutGoogle()" class="text-[10px] bg-black/20 hover:bg-black/30 text-white px-2 py-1 rounded">Sair</button>
      </div>
    </div>
  </div>
</header>
